<title>Buku Kelas</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a school exercise book. Blue cover sidebar, a white notebook page with a red margin line,
   the teacher's red pen (Caveat) for dates, topics and grades. Everything else stays quiet and ruled. */
:root{
  --paper:#F5F7FC;--surface:#FFFFFF;--ink:#16213A;--muted:#5A6684;
  --rule:#D6DEF0;--rule-strong:#B3C0E2;
  --cover:#1F3B87;--cover-ink:#FFFFFF;--cover-mute:#BAC7EC;
  --accent:#2447A9;--accent-fg:#FFFFFF;--accent-soft:#E3EAFB;
  --red:#D13B33;
  --ok:#1E7A46;--ok-bg:#DDF1E4;--info:#245FA8;--info-bg:#DDE9F7;
  --warn:#9A6400;--warn-bg:#FBEBC8;--bad:#B3261E;--bad-bg:#F9DEDB;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Caveat','Bradley Hand','Segoe Print',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1424;--surface:#151D33;--ink:#E8EDFA;--muted:#9AA7C7;
    --rule:#27325A;--rule-strong:#364780;
    --cover:#18285A;--cover-ink:#F2F5FF;--cover-mute:#9FB0DC;
    --accent:#8FAAF2;--accent-fg:#0B1330;--accent-soft:#1D2B55;
    --red:#F2837B;
    --ok:#6FD398;--ok-bg:#173626;--info:#8DB8F0;--info-bg:#172B45;
    --warn:#F0C25A;--warn-bg:#3A2D0E;--bad:#F29A94;--bad-bg:#3F1B18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1424;--surface:#151D33;--ink:#E8EDFA;--muted:#9AA7C7;
  --rule:#27325A;--rule-strong:#364780;
  --cover:#18285A;--cover-ink:#F2F5FF;--cover-mute:#9FB0DC;
  --accent:#8FAAF2;--accent-fg:#0B1330;--accent-soft:#1D2B55;
  --red:#F2837B;
  --ok:#6FD398;--ok-bg:#173626;--info:#8DB8F0;--info-bg:#172B45;
  --warn:#F0C25A;--warn-bg:#3A2D0E;--bad:#F29A94;--bad-bg:#3F1B18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.container{max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h2{font-size:1.2rem}
h3{font-size:1.02rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

:where(input[type=text],input[type=password],input[type=date],input[type=number]){
  background:var(--surface);border:1px solid var(--rule-strong);border-radius:8px;padding:8px 10px;min-height:42px;width:100%;
}
:where(input,select):focus{border-color:var(--accent)}
:where(select){
  font-weight:600;background:var(--surface);border:1px solid var(--rule-strong);border-radius:8px;padding:8px 10px;min-height:42px;max-width:100%;
}
select option{background:var(--surface);color:var(--ink)}
:where(textarea){background:var(--surface);border:1px solid var(--rule-strong);border-radius:8px;padding:8px 10px;width:100%;min-height:110px;resize:vertical;font:inherit}
:where(textarea):focus{border-color:var(--accent)}
input[type=file]{width:100%;font-size:.9rem;max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:8px 14px;margin-right:12px;cursor:pointer;min-height:42px}
.preview{border:1px solid var(--rule-strong);border-radius:10px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row .field{flex:1 1 170px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule-strong);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:42px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.88rem}

.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.brand b{font-weight:800;font-size:1.1rem;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font-size:.8rem;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;padding:4px 10px;font-size:.8rem;font-weight:700;color:var(--muted);min-height:34px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* ---------- landing ---------- */
.topnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"copy" "login" "sheet";gap:24px;padding-block:20px 8px}
@media (min-width:900px){
  .hero{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-areas:"copy login" "sheet login";gap:28px 64px;padding-block:36px 8px}
}
.copy{grid-area:copy;display:flex;flex-direction:column;gap:16px}
.copy h1{font-size:clamp(2.1rem,5vw,3.5rem);letter-spacing:-.035em;line-height:1.05;max-width:20ch}
.copy p{font-size:1.1rem;color:var(--muted);max-width:52ch}
.logincard{grid-area:login;align-self:start;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px}
.logincard h2{font-size:1.45rem}
.logincard form{display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-size:.9rem}
.demo{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.88rem}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.sheetwrap{grid-area:sheet;margin:0;display:flex;flex-direction:column;gap:8px;max-width:520px}
.sheet{
  position:relative;background-color:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:18px 20px 18px 62px;
  background-image:linear-gradient(to bottom,transparent 33px,var(--rule) 33px);
  background-size:100% 34px;background-position:0 18px;
}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:2px;background:var(--red);opacity:.5}
.sheet .l{height:34px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet .l.d{font-family:var(--hand);font-weight:700;font-size:1.7rem;color:var(--red)}
.sheet .l.t{font-family:var(--hand);font-weight:600;font-size:1.4rem}
.sheetwrap figcaption{font-size:.82rem;color:var(--muted)}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px 36px;margin-top:48px;padding-top:32px;border-top:2px solid var(--rule)}
.feat{display:flex;flex-direction:column;gap:8px}
.feat .i{width:26px;height:26px;color:var(--accent)}
.feat p{color:var(--muted);max-width:40ch}
.sitefoot{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font-size:.85rem;color:var(--muted)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:900px){.shell{grid-template-columns:250px minmax(0,1fr);gap:20px}}
.side{
  background:var(--cover);color:var(--cover-ink);border-radius:14px;padding:16px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand foot" "pick pick" "nav nav";gap:12px;
}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:20px;position:sticky;top:16px;min-height:calc(100vh - 32px);padding:20px 16px}
}
.side .brand{grid-area:brand}
.side .brand b{color:var(--cover-ink)}
.side .brand span{color:var(--cover-mute)}
.side .logo{background:rgba(255,255,255,.16);color:#fff}
.side-foot{grid-area:foot;display:flex;align-items:center;gap:8px}
.side-foot .who{display:none;font-size:.85rem;color:var(--cover-mute);overflow-wrap:anywhere}
@media (min-width:900px){
  .side-foot{order:9;margin-top:auto;flex-direction:column;align-items:stretch}
  .side-foot .who{display:block}
}
.side .lang{background:transparent;border-color:rgba(255,255,255,.35)}
.side .lang button{color:var(--cover-mute)}
.side .lang button[aria-pressed="true"]{background:#fff;color:#1F3B87}
.side .btn{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.side .btn:hover{border-color:#fff}
.pick{grid-area:pick;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pick label{flex-basis:100%;font-size:.8rem;font-weight:600;color:var(--cover-mute)}
.pick select{flex:1 1 140px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;font-weight:700}
.sidenav{grid-area:nav;display:flex;gap:4px;overflow-x:auto}
@media (min-width:900px){.sidenav{flex-direction:column;overflow:visible}}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--cover-mute);padding:10px 12px;border-radius:8px;font-weight:600;white-space:nowrap;min-height:44px;text-align:left}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtn[aria-current="page"]{background:rgba(255,255,255,.17);color:#fff}

.page{
  background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:20px 16px 28px;
  display:flex;flex-direction:column;gap:22px;min-width:0;position:relative;
}
@media (min-width:900px){
  .page{padding:30px 36px 36px 80px;min-height:calc(100vh - 32px)}
  .page::before{content:"";position:absolute;top:0;bottom:0;left:54px;width:2px;background:var(--red);opacity:.5}
}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--rule)}
.ph h1{font-size:clamp(1.6rem,3.4vw,2.2rem);letter-spacing:-.03em}
.sec{display:flex;flex-direction:column;gap:16px;min-width:0}
.block{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.saved{font-size:.82rem;color:var(--muted)}

/* attendance */
.penrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.pen-date{font-family:var(--hand);font-weight:700;font-size:clamp(1.8rem,4.2vw,2.4rem);color:var(--red);line-height:1.1}
.ctl{flex:0 1 auto}
.ctl .field{flex:0 1 190px}
.topic{display:flex;flex-direction:column;gap:2px}
.topic label{font-size:.82rem;font-weight:600;color:var(--muted)}
.topic input{font-family:var(--hand);font-size:1.55rem;font-weight:600;border:0;border-bottom:2px solid var(--rule-strong);border-radius:0;background:transparent;padding:2px 2px 4px;min-height:46px}
.topic input:focus{border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:3px 11px;font-size:.82rem;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.chip.h,.pill.ok{background:var(--ok-bg);color:var(--ok)}
.chip.i{background:var(--info-bg);color:var(--info)}
.chip.s,.pill.warn{background:var(--warn-bg);color:var(--warn)}
.chip.a,.pill.bad{background:var(--bad-bg);color:var(--bad)}
.chip.n{background:var(--paper);color:var(--muted);border:1px solid var(--rule)}
.pill{border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.none{background:var(--paper);color:var(--muted)}
.list{display:flex;flex-direction:column}
.stu{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.stu:last-child{border-bottom:0}
.stu .nm{min-width:0;flex:1 1 180px}
.stu .nm b{font-weight:700;overflow-wrap:anywhere}
.seg{display:inline-flex;gap:6px}
.seg button{min-width:64px;min-height:42px;border:1px solid var(--rule-strong);background:var(--surface);border-radius:8px;font-weight:700;font-size:.85rem;padding:0 10px}
.seg button:hover{border-color:var(--accent)}
.seg button.on.h{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.seg button.on.i{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.seg button.on.s{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.seg button.on.a{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.hand{font-family:var(--hand);font-weight:600;font-size:1.35rem;line-height:1.2}

/* tables */
.scroll{overflow-x:auto;border-top:2px solid var(--rule-strong);border-bottom:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-top:1px solid var(--rule)}
thead th{border-top:0;border-bottom:2px solid var(--rule-strong);font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap}
th small{display:block;font-weight:500}
tbody tr:first-child td{border-top:0}
td.num,th.num{text-align:center}
td input[type=number]{width:74px;text-align:center;padding:6px;min-height:38px}
.mark{font-family:var(--hand);font-weight:700;font-size:1.6rem;color:var(--red);line-height:1;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 0;margin:0}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stats div{padding:2px 16px;border-left:2px solid var(--rule-strong)}
.stats dt{font-size:.82rem;color:var(--muted);font-weight:600}
.stats dd{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.2}
.pc{display:flex;align-items:center;gap:10px}
.bar{height:6px;width:80px;background:var(--rule);border-radius:3px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}
.logitem{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.logitem:last-child{border-bottom:0}
.logitem .nm{flex:1 1 220px;min-width:0}
.incl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20;
  max-width:calc(100vw - 32px);text-align:center;
}
@media (prefers-reduced-motion:no-preference){.btn,.seg button,.navbtn{transition:background .12s,border-color .12s,color .12s}}
</style>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hash(s){
  try{
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode('bk:'+s)).then(function(b){
      return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
    });
  }catch(e){return Promise.resolve('p:'+s)}
}

  var pat=[
    ['H','H','H','H','H','H'],
    ['H','S','H','H','I','H'],

  ];
  [2,1,0].forEach(function(back,j){
    var dt=shift(back+1),rec={};
    d.students.forEach(function(s,i){rec[s.id]=pat[j][i]});
    d.attendance[dt]=rec;
    d.topics[dt]=['Bilangan bulat','Pecahan','Desimal'][j];
  });
  var g=[[80,85,78,82],[70,72,68,74],[90,88,92,95],[65,70,60,''],[78,80,'',''],[85,'','','']];
  d.students.forEach(function(s,i){d.grades[s.id]={tugas:g[i][0],uh:g[i][1],uts:g[i][2],uas:g[i][3]}});

function avg(g){
  var s=0,w=0;
  FIELDS.forEach(function(k){var v=g&&g[k];if(v!==''&&v!==null&&v!==undefined&&!isNaN(v)){s+=Number(v)*W[k];w+=W[k]}});
  return w?s/w:null;
}

function recapOf(c){

    ds.forEach(function(d){var v=(c.attendance[d]||{})[s.id];if(v&&k[v]!==undefined){k[v]++;n++}});

/* ---------- spreadsheet export ---------- */
function dateList(c){
  var all={};
  Object.keys(c.attendance).forEach(function(d){all[d]=1});
  Object.keys(c.topics||{}).forEach(function(d){all[d]=1});
  return Object.keys(all).sort();
}
function r1(x){return x===null?'':Math.round(x*10)/10}
function absAOA(c){
  var ds=dateList(c);
  var head=[t('nis'),t('name')].concat(ds,[t('H'),t('I'),t('S'),t('A'),t('pct')+' %']);
  var tops=['',t('topic')].concat(ds.map(function(d){return (c.topics&&c.topics[d])||''}),['','','','','']);
  var rows=c.students.map(function(s){
    var k={H:0,I:0,S:0,A:0},n=0;
    var cells=ds.map(function(d){var v=(c.attendance[d]||{})[s.id]||'';if(v&&k[v]!==undefined){k[v]++;n++;return t(v)}return ''});
    return [s.nis||'',s.name].concat(cells,[k.H,k.I,k.S,k.A,n?Math.round(k.H/n*100):'']);
  });
  return [head,tops].concat(rows);
}
function logAOA(c){
  var rows=dateList(c).reverse().map(function(d){
    var rec=c.attendance[d]||{},k={H:0,I:0,S:0,A:0};
    Object.keys(rec).forEach(function(id){if(k[rec[id]]!==undefined)k[rec[id]]++});
    var marked=k.H+k.I+k.S+k.A;
    return [d,(c.topics&&c.topics[d])||'',k.H,k.I,k.S,k.A,Math.max(0,c.students.length-marked)];
  });
  return [[t('date'),t('topic'),t('H'),t('I'),t('S'),t('A'),t('N')]].concat(rows);
}
function gradesAOA(c){
  var head=[t('nis'),t('name')].concat(FIELDS.map(function(k){return t(FKEY[k])+' ('+W[k]+'%)'}),[t('avg'),'Status']);
  var rows=c.students.map(function(s){
    var g=(c.grades||{})[s.id]||{},a=avg(g);
    return [s.nis||'',s.name].concat(FIELDS.map(function(k){var v=g[k];return (v===''||v===undefined||v===null)?'':Number(v)}),
      [r1(a),a===null?'':(a>=Number(c.kkm)?t('passed'):t('below'))]);
  });
  return [head].concat(rows,[[],[t('kkm'),Number(c.kkm)]]);
}
function recapAOA(c){
  var head=[t('nis'),t('name'),t('H'),t('I'),t('S'),t('A'),t('meet'),t('pct')+' %',t('avg')];
  var rows=recapOf(c).map(function(r){
    return [r.s.nis||'',r.s.name,r.k.H,r.k.I,r.k.S,r.k.A,r.n,r.pct===null?'':r.pct,r1(r.avg)];
  });
  return [head].concat(rows);
}
function addSheet(wb,used,name,aoa){
  var ws=XLSX.utils.aoa_to_sheet(aoa),cols=[];
  aoa.forEach(function(r){r.forEach(function(v,i){
    var l=String(v===undefined||v===null?'':v).length;
    cols[i]=Math.max(cols[i]||6,Math.min(40,l+2));
  })});
  ws['!cols']=cols.map(function(w){return {wch:w}});
  var base=String(name).replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31)||'Sheet',n=base,i=2;
  while(used[n.toLowerCase()]){var sfx=' '+(i++);n=base.slice(0,31-sfx.length)+sfx}
  used[n.toLowerCase()]=1;
  XLSX.utils.book_append_sheet(wb,ws,n);
}
function buildWorkbook(list){
  var wb=XLSX.utils.book_new(),used={},multi=list.length>1;
  list.forEach(function(c){
    var p=multi?String(c.cls).slice(0,12)+' ':'';
    addSheet(wb,used,p+t('tAbs'),absAOA(c));
    addSheet(wb,used,p+t('tLog'),logAOA(c));
    addSheet(wb,used,p+t('tGrades'),gradesAOA(c));
    addSheet(wb,used,p+t('tRecap'),recapAOA(c));
  });
  return wb;
}

/* ---------- student import ---------- */
var NAME_RE=/^(nama( lengkap| murid| siswa| peserta didik)?|name|full name|student name|murid|siswa|student)$/i;
var NIS_RE=/^(nis|nisn|nipd|id|no\.? ?induk|nomor induk|student id|student number)$/i;
function cs(v){return String(v===undefined||v===null?'':v).replace(/\s+/g,' ').trim()}
function hasLetters(s){return /[A-Za-zÀ-ɏ]/.test(s)}
function isId(s){return /^[0-9][0-9.\-\/]*$/.test(s)}
function looksCode(s){return /\d/.test(s)&&/^[A-Za-z0-9][A-Za-z0-9.\-\/]*$/.test(s)}
function rowsToStudents(aoa){
  var rows=aoa.map(function(r){return r.map(cs)}).filter(function(r){return r.some(function(c){return c!==''})});
  var out=[],i,j;
  if(!rows.length)return out;
  var hi=-1,nameCol=-1,nisCol=-1;
  for(i=0;i<Math.min(rows.length,10)&&hi<0;i++){
    var nc=-1,ni=-1;
    for(j=0;j<rows[i].length;j++){
      if(nc<0&&NAME_RE.test(rows[i][j]))nc=j;
      else if(ni<0&&NIS_RE.test(rows[i][j]))ni=j;
    }
    if(nc>=0){hi=i;nameCol=nc;nisCol=ni}
  }
  if(hi>=0){
    rows.slice(hi+1).forEach(function(r){out.push({name:r[nameCol]||'',nis:nisCol>=0?(r[nisCol]||''):''})});
  }else{
    var seq=rows.length>1&&rows.every(function(r,k){return r.length>=2&&r[0]===String(k+1)});
    rows.forEach(function(r){
      if(seq)r=r.slice(1);
      var cells=r.filter(function(c){return c!==''});
      if(!cells.length)return;
      if(cells.length===1){out.push({name:cells[0].replace(/^\d+[.)]\s+/,''),nis:''});return}
      var a=cells[0],b=cells[1];
      if(isId(a)&&hasLetters(b))out.push({name:b,nis:a});
      else if(hasLetters(a)&&(isId(b)||looksCode(b)))out.push({name:a,nis:b});
      else out.push({name:a,nis:''});
    });
  }
  var skip={};skip[T.id.topic.toLowerCase()]=1;skip[T.en.topic.toLowerCase()]=1;
  return out.filter(function(r){return r.name&&hasLetters(r.name)&&!skip[r.name.toLowerCase()]});
}
function parseText(text){
  var aoa=String(text||'').split(/\r?\n/).map(function(l){
    if(l.indexOf('\t')>=0)return l.split('\t');
    if(l.indexOf(';')>=0)return l.split(';');
    return [l];
  });
  return rowsToStudents(aoa);
}
function finishParse(list){
  var seenN={},seenI={},dupes=0,rows=[];
  if(!data.example)data.students.forEach(function(s){seenN[s.name.toLowerCase()]=1;if(s.nis)seenI[s.nis]=1});
  list.forEach(function(r){
    var kn=r.name.toLowerCase();
    if(seenN[kn]||(r.nis&&seenI[r.nis])){dupes++;return}
    seenN[kn]=1;if(r.nis)seenI[r.nis]=1;rows.push(r);
  });
  if(rows.length>500)rows=rows.slice(0,500);
  if(!rows.length){imp=null;impErr=dupes?(dupes+' '+t('impSkipped')):t('impNone')}
  else{imp={rows:rows,dupes:dupes};impErr=''}
  render();
}
function readFile(f){
  if(typeof XLSX==='undefined'){impErr=t('impNoLib');render();return}
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var wb=XLSX.read(fr.result,{type:'array'}),aoa=[],i;
      for(i=0;i<wb.SheetNames.length;i++){
        var a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]],{header:1,raw:false,defval:''});
        if(a.some(function(r){return r.some(function(c){return String(c).trim()!==''})})){aoa=a;break}
      }
      finishParse(rowsToStudents(aoa));
    }catch(e){imp=null;impErr=t('impBad');render()}
  };
  fr.onerror=function(){imp=null;impErr=t('impBad');render()};
  fr.readAsArrayBuffer(f);
}
function applyImport(){
  if(!imp)return;
  if(data.example){data.students=[];data.attendance={};data.grades={};data.topics={};data.example=false}
  var base=Date.now().toString(36),n=imp.rows.length;
  imp.rows.forEach(function(r,i){data.students.push({id:'s'+base+'-'+i,name:r.name,nis:r.nis})});
  imp=null;impErr='';save();render();
  toast(n+' '+t('impDone'));
}

function doExport(scope){

  saveBuf(name,buf);
}

function exampleNote(){

function viewAbs(){
  var rec=data.attendance[date]||{};
  var c={H:0,I:0,S:0,A:0,N:0};
  data.students.forEach(function(s){var v=rec[s.id];if(v)c[v]++;else c.N++});
  var rows=data.students.map(function(s){
    var cur=rec[s.id]||'';
    return '<div class="stu"><div class="nm"><b>'+esc(s.name)+'</b><div class="small muted">'+esc(s.nis||'')+'</div></div>'+
      '<div class="seg" role="group" aria-label="'+esc(s.name)+'">'+
      ST.map(function(k){return '<button type="button" class="'+k.toLowerCase()+(cur===k?' on':'')+'" aria-pressed="'+(cur===k)+'" data-act="mark" data-id="'+s.id+'" data-v="'+k+'">'+t(k)+'</button>'}).join('')+
      '</div></div>';
  }).join('');
  return '<section class="sec">'+
    '<div class="penrow"><div class="pen-date">'+esc(fmtDate(date))+'</div>'+
    '<div class="row ctl"><div class="field"><label for="date">'+t('date')+'</label><input type="date" id="date" value="'+date+'"></div>'+
    '<button class="btn" data-act="allpresent">'+t('allPresent')+'</button><button class="btn" data-act="clearday">'+t('clearDay')+'</button></div></div>'+
    '<div class="topic"><label for="topic">'+t('topic')+'</label><input type="text" id="topic" maxlength="120" autocomplete="off" placeholder="'+esc(t('topicPh'))+'" value="'+esc(data.topics[date]||'')+'"></div>'+
    '<div class="chips"><span class="chip h">'+t('H')+' '+c.H+'</span><span class="chip i">'+t('I')+' '+c.I+'</span><span class="chip s">'+t('S')+' '+c.S+'</span><span class="chip a">'+t('A')+' '+c.A+'</span><span class="chip n">'+t('N')+' '+c.N+'</span></div>'+
    (rows?'<div class="list">'+rows+'</div>':'<div class="empty">'+t('noStudents')+'</div>')+
    '<p class="saved">'+t('autosave')+'</p></section>';
}
function viewLog(){

    var rec=data.attendance[d]||{},c={H:0,I:0,S:0,A:0};

      '<button class="btn sm" data-act="open" data-v="'+d+'">'+t('open')+'</button></div>';

  return '<section class="sec"><p class="muted">'+t('logHint')+'</p>'+

function viewGrades(){
  var head='<tr><th>'+t('name')+'</th>'+FIELDS.map(function(k){return '<th class="num">'+t(FKEY[k])+'<small>'+t('weight')+' '+W[k]+'%</small></th>'}).join('')+'<th>'+t('avg')+'</th></tr>';

      '<td id="f-'+s.id+'">'+finalHtml(avg(g))+'</td></tr>';

    '<div class="field" style="flex:0 0 110px"><label for="kkm">'+t('kkm')+'</label><input type="number" id="kkm" min="0" max="100" value="'+esc(data.kkm)+'"></div></div>'+
    (data.students.length?'<div class="scroll"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>':'<div class="empty">'+t('noStudents')+'</div>')+
    '<p class="saved">'+t('autosave')+'</p></section>';

function viewRecap(){
  var rr=recapOf(data);
  var pcts=rr.filter(function(r){return r.pct!==null}).map(function(r){return r.pct});
  var avgs=rr.filter(function(r){return r.avg!==null}).map(function(r){return r.avg});
  var mean=function(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null};
  var mp=mean(pcts),mg=mean(avgs);
  var lessons=Object.keys(data.attendance).length;
  var rows=rr.map(function(r){
    var cls=r.pct===null?'':(r.pct>=90?'':(r.pct>=75?'warn':'bad'));
    return '<tr><td><b>'+esc(r.s.name)+'</b></td><td class="num">'+r.k.H+'</td><td class="num">'+r.k.I+'</td><td class="num">'+r.k.S+'</td><td class="num">'+r.k.A+'</td>'+
      '<td>'+(r.pct===null?'<span class="pill none">–</span>':'<div class="pc"><div class="bar"><i class="'+cls+'" style="width:'+r.pct+'%"></i></div><b>'+r.pct+'%</b></div>')+'</td>'+
      '<td>'+(r.avg===null?'<span class="pill none">–</span>':'<span class="mark">'+r.avg.toFixed(1)+'</span>')+'</td></tr>';
  }).join('');
  return '<section class="sec">'+
    '<dl class="stats">'+
      '<div><dt>'+t('stStudents')+'</dt><dd>'+data.students.length+'</dd></div>'+
      '<div><dt>'+t('stLessons')+'</dt><dd>'+lessons+'</dd></div>'+
      '<div><dt>'+t('stAttend')+'</dt><dd>'+(mp===null?'–':Math.round(mp)+'%')+'</dd></div>'+
      '<div><dt>'+t('stGrade')+'</dt><dd>'+(mg===null?'–':mg.toFixed(1))+'</dd></div>'+
    '</dl>'+
    '<p class="muted small">'+t('recapHint')+'</p>'+
    (data.students.length?'<div class="scroll"><table><thead><tr><th>'+t('name')+'</th><th class="num">'+t('H')+'</th><th class="num">'+t('I')+'</th><th class="num">'+t('S')+'</th><th class="num">'+t('A')+'</th><th>'+t('pct')+'</th><th>'+t('avg')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">'+t('noStudents')+'</div>')+
    '</section>';
}

      '<div class="field"><label for="sid">'+t('nis')+'</label><input type="text" id="sid" autocomplete="off"></div>'+

function sidebar(){

var app=document.getElementById('app');
function render(){
  document.documentElement.lang=lang;
  app.innerHTML=(session&&data)?viewApp():viewAuth();
}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  if(act==='lang'){lang=v;store.set('bk:lang',lang);render()}
  else if(act==='authmode'){authMode=authMode==='login'?'register':'login';authErr='';render()}
  else if(act==='logout'){session=null;data=null;acct=null;store.set('bk:session','');confirmDel=null;render()}
  else if(act==='tab'){tab=v;confirmDel=null;confirmClass=false;imp=null;impErr='';render()}
  else if(act==='mark'){
    var rec=data.attendance[date]||(data.attendance[date]={});
    if(rec[id]===v)delete rec[id];else rec[id]=v;
    if(!Object.keys(rec).length)delete data.attendance[date];
    save();render();
  }
  else if(act==='allpresent'){
    var r={};data.students.forEach(function(s){r[s.id]='H'});
    if(data.students.length)data.attendance[date]=r;
    save();render();
  }
  else if(act==='clearday'){delete data.attendance[date];save();render()}
  else if(act==='open'){date=v;tab='abs';render()}
  else if(act==='newclass'){tab='stu';render();var nc=document.getElementById('newcls');if(nc)nc.focus()}
  else if(act==='delclass'){
    if(confirmClass){
      acct.classes=acct.classes.filter(function(c){return c.id!==data.id});
      acct.cur=acct.classes[0].id;pick();confirmClass=false;confirmDel=null;save();
    }else confirmClass=true;
    render();
  }
  else if(act==='del'){
    if(confirmDel===id){
      data.students=data.students.filter(function(s){return s.id!==id});
      delete data.grades[id];
      Object.keys(data.attendance).forEach(function(d){delete data.attendance[d][id];if(!Object.keys(data.attendance[d]).length)delete data.attendance[d]});
      confirmDel=null;save();
    }else confirmDel=id;
    render();
  }
  else if(act==='clearexample'){data.students=[];data.attendance={};data.grades={};data.topics={};data.example=false;save();render()}
  else if(act==='exp-class'){doExport('class')}
  else if(act==='exp-all'){doExport('all')}
  else if(act==='copy'){copyRecap()}
  else if(act==='imp-paste'){var ta=document.getElementById('paste');finishParse(parseText(ta?ta.value:''))}
  else if(act==='imp-confirm'){applyImport()}
  else if(act==='imp-cancel'){imp=null;impErr='';render()}
  else if(act==='imp-template'){downloadTemplate()}
});
app.addEventListener('change',function(e){
  if(e.target.id==='date'&&e.target.value){date=e.target.value;render()}
  else if(e.target.id==='impfile'){var f=e.target.files&&e.target.files[0];if(f)readFile(f)}
  else if(e.target.id==='clsSel'){acct.cur=e.target.value;pick();confirmDel=null;confirmClass=false;save();render()}
});
app.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.g){
    var raw=el.value,val='';
    if(raw!==''&&!isNaN(raw))val=Math.max(0,Math.min(100,Number(raw)));
    var g=data.grades[el.dataset.g]||(data.grades[el.dataset.g]={});
    g[el.dataset.k]=val;save();
    var cell=document.getElementById('f-'+el.dataset.g);
    if(cell)cell.innerHTML=finalHtml(avg(g));
  }else if(el.id==='kkm'){
    var k=Number(el.value);
    if(!isNaN(k)){data.kkm=Math.max(0,Math.min(100,k));save();
      data.students.forEach(function(s){var c=document.getElementById('f-'+s.id);if(c)c.innerHTML=finalHtml(avg(data.grades[s.id]))});}
  }else if(el.id==='topic'){
    if(el.value.trim())data.topics[date]=el.value;else delete data.topics[date];
    save();
  }else if(el.id==='cls'){
    data.cls=el.value.trim()||'-';save();
    var opt=document.querySelector('#clsSel option[value="'+data.id+'"]');
    if(opt)opt.textContent=data.cls;
  }
});
app.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target.dataset.form;
  if(f==='auth'){
    var u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value;
    if(!u||!p){authErr=t('errEmpty');render();return}
    var users=pj('bk:users',{});
    hash(p).then(function(h){
      if(authMode==='register'){
        if(p.length<4){authErr=t('errShort');render();return}
        if(users[u]){authErr=t('errExists');render();return}
        users[u]=h;store.set('bk:users',JSON.stringify(users));
      }else if(users[u]!==h){authErr=t('errCred');render();return}
      session=u;store.set('bk:session',u);authErr='';tab='abs';date=today();load();render();
    });
  }else if(f==='addcls'){
    var nm=document.getElementById('newcls').value.trim();
    if(!nm){document.getElementById('newcls').focus();return}
    var nc={id:'c'+Date.now().toString(36)+Math.floor(Math.random()*100),cls:nm,kkm:75,example:false,students:[],attendance:{},grades:{},topics:{}};
    acct.classes.push(nc);acct.cur=nc.id;pick();confirmClass=false;confirmDel=null;save();tab='stu';render();
    document.getElementById('sn').focus();
  }else if(f==='add'){
    var n=document.getElementById('sn').value.trim(),s=document.getElementById('sid').value.trim();
    if(!n){document.getElementById('sn').focus();return}
    data.students.push({id:'s'+Date.now().toString(36)+Math.floor(Math.random()*100),name:n,nis:s});
    save();render();
    document.getElementById('sn').focus();
  }
});

/* ---------- start ---------- */
(function init(){
  var users=pj('bk:users',{});
  var go=function(){
    if(session&&users[session]!==undefined){load()}else{session=null}
    render();
  };
  if(!users.guru){
    hash('guru123').then(function(h){users.guru=h;store.set('bk:users',JSON.stringify(users));go()});
  }else go();
})();
render();

try{
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(x){
      dl=x||null;
      if(dl&&session&&data)render();
    }).catch(function(){});
  }
}catch(e){}
})();
